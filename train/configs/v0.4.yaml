# v0.2: QLoRA on our own MLX 4-bit conversion of the official Qwen/Qwen3.8-27B
# (models/qwen3.8-27b-mlx-4bit, made with: mlx_lm convert -q --q-bits 4 --q-group-size 32),
# dataset v0.2, LoRA on the last 16 of 64 blocks (2x faster, see docs/status.md).
model: models/qwen3.8-27b-mlx-4bit
train: true
data: data/v0.4
adapter_path: adapters/v0.4
fine_tune_type: lora
num_layers: 16
lora_parameters:
  rank: 16
  scale: 2.0
  dropout: 0.0
mask_prompt: true
grad_checkpoint: true
max_seq_length: 2048
batch_size: 2
grad_accumulation_steps: 2   # effective batch 4; batch 4 hit Metal OOM at it. 115 (1017-token sample)
iters: 1430               # micro-batches of 2 = 715 optimizer updates = ~2 epochs over 1429 samples
learning_rate: 1.0e-4
lr_schedule:
  name: cosine_decay
  warmup: 20
  arguments: [1.0e-4, 715, 1.0e-6]
steps_per_report: 20
steps_per_eval: 100
val_batches: -1
save_every: 100
seed: 38
