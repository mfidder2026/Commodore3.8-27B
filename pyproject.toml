[project]
name = "commodore38"
version = "0.1.0"
description = "Data, verification and evaluation tooling for Commodore3.8-27B, a Commodore-focused fine-tune of Qwen3.8-27B"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
c38-verify = "commodore38.verify:main"
c38-eval = "commodore38.eval.runner:main"
c38-synth = "commodore38.data.synth:main"
c38-write = "commodore38.write:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["commodore38"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["vice: needs a working VICE installation (slow)"]
